<!DOCTYPE html><html><head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
<form method="POST" class="bg-white p-8 rounded-xl shadow w-full max-w-sm">
<h2 class="text-2xl font-bold mb-6">Create Your Shop</h2>
<input name="username" placeholder="Shop Name (e.g. Bella Boutique)" required class="w-full border p-3 rounded mb-3">
<input name="email" type="email" placeholder="Email for receipts" required class="w-full border p-3 rounded mb-3">
<input name="vat" placeholder="VAT Number (optional) e.g. GB123" class="w-full border p-3 rounded mb-3">
<input name="password" type="password" placeholder="Password" required class="w-full border p-3 rounded mb-4">
<button class="w-full bg-black text-white p-3 rounded font-bold">Create Shop - Free</button>
<p class="text-xs text-gray-500 mt-3 text-center">GDPR: Your data is private. We don't sell it.</p>
<a href="/login" class="text-sm text-center block mt-4">Already have shop? Login</a>
</form></body></html>
