<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:monospace;padding:20px;max-width:400px;margin:auto;background:#fff}
.logo{font-size:40px;text-align:center}
h2{text-align:center;margin:5px}
.line{border-top:2px dashed #000;margin:10px 0}
@media print{button{display:none}}
</style></head><body>
<div class="logo">🛍️</div>
<h2>{{shop_name}}</h2>
<p style="text-align:center">RECEIPT #{{sale.id}}<br>{{date}}<br>Currency: {{currency}}</p>
<div class="line"></div>
<p>Item: {{sale.product}}<br>Qty: {{sale.qty}} x {{symbol}}{{sale.price}}<br><b>Total: {{symbol}}{{sale.total}}</b><br>Profit: {{symbol}}{{sale.profit}}</p>
<div class="line"></div>
<p style="text-align:center">Thank You!<br>Come Again</p>
<button onclick="window.print()" style="width:100%;padding:15px;background:#000;color:#fff;border:none;border-radius:8px;margin-top:20px">🖨️ Print Receipt</button>
<a href="/?currency={{currency}}" style="display:block;text-align:center;margin-top:10px;color:#000">← Back to Shop</a>
</body></html>
