<!DOCTYPE html><html><head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
<form method="POST" class="bg-white p-8 rounded-xl shadow w-full max-w-sm">
<h2 class="text-2xl font-bold mb-6">Login to Your Shop</h2>
<input name="username" placeholder="Shop Name" required class="w-full border p-3 rounded mb-3">
<input name="password" type="password" placeholder="Password" required class="w-full border p-3 rounded mb-4">
<button class="w-full bg-black text-white p-3 rounded">Login</button>
<a href="/register" class="text-sm text-center block mt-4">New? Create shop</a>
</form></body></html>
